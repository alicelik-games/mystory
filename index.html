<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ali Çelik Games | Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00f2ff; --bg-dark: #0a0b10; --card-bg: #16181d; --text-main: #ffffff; --text-dim: #94a3b8; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); line-height: 1.6; overflow-x: hidden; }
        body::before { content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at 50% 50%, #1e293b 0%, #0a0b10 100%); z-index: -1; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        nav { padding: 30px 0; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-weight: 900; font-size: 1.5rem; letter-spacing: -1px; text-transform: uppercase; }
        .logo span { color: var(--primary); }
        .hero { height: 40vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        .hero h1 { font-size: clamp(2.5rem, 8vw, 4rem); font-weight: 900; background: linear-gradient(to bottom, #fff 40%, #64748b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .section-label { color: var(--primary); text-transform: uppercase; letter-spacing: 4px; font-size: 0.8rem; font-weight: 700; margin-bottom: 30px; display: block; }
        .games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 30px; margin-bottom: 80px; }
        .game-card { background: var(--card-bg); border-radius: 24px; border: 1px solid rgba(255,255,255,0.05); transition: 0.4s; cursor: pointer; text-decoration: none; color: white; overflow: hidden; }
        .game-card:hover { transform: translateY(-10px); border-color: var(--primary); box-shadow: 0 20px 40px rgba(0, 242, 255, 0.1); }
        .card-visual { height: 200px; display: flex; align-items: center; justify-content: center; font-size: 3.5rem; }
        .visual-1 { background: linear-gradient(45deg, #FF3CAC, #2B86C5); }
        .visual-2 { background: linear-gradient(45deg, #00DBDE, #FC00FF); }
        .visual-3 { background: linear-gradient(45deg, #08AEEA, #2AF598); }
        .game-info { padding: 25px; }
        .main-btn { display: block; background: var(--primary); color: #000; padding: 10px; border-radius: 10px; text-decoration: none; font-weight: 700; text-align: center; margin-top: 15px; }
        footer { padding: 40px 0; text-align: center; opacity: 0.5; font-size: 0.9rem; }
    </style>
</head>
<body>
<div class="container">
    <nav><div class="logo">Ali Celik<span>Games</span></div></nav>
    <header class="hero"><h1>Future of Mobile Gaming</h1></header>
    <main>
        <span class="section-label">Projeler</span>
        <div class="games-grid">
            <a href="falling-letters.html" class="game-card">
                <div class="card-visual visual-1">🔠</div>
                <div class="game-info"><h3>Falling Letters</h3><p>Healthy Brain Word Puzzle</p><div class="main-btn">Detaylar</div></div>
            </a>
            <a href="rotanot.html" class="game-card">
                <div class="card-visual visual-2">📍</div>
                <div class="game-info"><h3>Rotanot</h3><p>Akıllı Seyahat Günlüğü</p><div class="main-btn">Detaylar</div></div>
            </a>
            <div class="game-card">
                <div class="card-visual visual-3">⚒️</div>
                <div class="game-info"><h3>Saha Asistanı</h3><p>Jeoloji Mühendisliği Aracı</p><div class="main-btn">Yakında</div></div>
            </div>
        </div>
    </main>
    <footer>© 2024 Ali Çelik Games</footer>
</div>
</body>
</html>
